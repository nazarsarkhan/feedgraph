server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: any unmatched path serves index.html so React Router can
  # handle the client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy: backend service on the compose network. Single origin keeps
  # the JWT cookie working without CORS or SameSite=None complications.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
  }
}
