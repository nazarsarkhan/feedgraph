services:
  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + the `vector` extension
    # preinstalled. Same env vars, same volume layout, same healthcheck
    # as the upstream postgres:16 — drop-in replacement. Needed for the
    # article embeddings + semantic-similarity feature; the migration
    # at boot runs `CREATE EXTENSION IF NOT EXISTS vector`.
    image: pgvector/pgvector:pg16
    container_name: feedgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ so compose passes the literal string through; the
      # variable expands inside the container at runtime against its own env.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      retries: 10
    networks:
      - feedgraph-net

  redis:
    image: redis:7-alpine
    container_name: feedgraph-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    networks:
      - feedgraph-net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: feedgraph-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # env_file ships every key from .env into the container, so any env
    # added to env.schema (FEED_*, PREFILTER_*, LLM_*, OPENAI_*) flows
    # through without an entry-per-key list to maintain. The `environment`
    # block below still wins on conflict and is reserved for compose-network
    # specific overrides (in-container hostnames, fixed port).
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      # Seed pre-fabricated demo data on first boot. Idempotent — re-runs
      # are no-ops once the demo user exists. See README.md for credentials
      # and how to disable.
      SEED_DEMO_ON_BOOT: 'true'
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3000/health']
      interval: 10s
      retries: 5
    networks:
      - feedgraph-net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: feedgraph-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    healthcheck:
      # 127.0.0.1 (not localhost) because nginx listens on IPv4 only and the
      # alpine BusyBox wget tries IPv6 first when given the 'localhost' name.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ > /dev/null || exit 1']
      interval: 10s
      retries: 5
    networks:
      - feedgraph-net

  bull-board:
    image: deadly0/bull-board:latest
    container_name: feedgraph-bull-board
    restart: unless-stopped
    depends_on:
      # service_healthy (not service_started) so bull-board doesn't poll
      # a redis that hasn't finished accepting connections yet.
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_LOGIN: ${USER_LOGIN}
      USER_PASSWORD: ${USER_PASSWORD}
    ports:
      - '${BULL_BOARD_PORT:-3030}:3000'
    networks:
      - feedgraph-net

volumes:
  pgdata:
  redisdata:

networks:
  # Declared explicitly so the network name is stable and predictable
  # across compose invocations rather than derived from the project dir.
  feedgraph-net:
    driver: bridge
